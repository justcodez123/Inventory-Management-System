name: Build and Release (Push to Main)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [windows-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win ${{ github.event_name != 'pull_request' && '--publish always' || '' }}

      # - name: Build for macOS
      #   if: matrix.os == 'macos-latest'
      #   working-directory: ./app
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: npm run build:mac

      # - name: Build for Linux
      #   if: matrix.os == 'ubuntu-latest'
      #   working-directory: ./app
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   # electron-builder might need some native dependencies on ubuntu for certain formats like snap
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y snapcraft
      #     npm run build:linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/**/*.exe
            app/dist/*.yml
          retention-days: 7

