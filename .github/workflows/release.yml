name: Publish Tagged Release (v*)

on:
  push:
    tags:
      - 'v*' # Trigger automatically when a tag like v1.1.4 is pushed

jobs:
  release:
    name: Build & Release on Windows
    runs-on: windows-latest

    # Grant permissions for GITHUB_TOKEN to create and publish releases
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Application & Publish Release
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: |
          npm run build
          npx electron-builder --win --publish always

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows-tag
          path: |
            app/dist/*.exe
            app/dist/**/*.exe
            app/dist/*.yml
          retention-days: 7

